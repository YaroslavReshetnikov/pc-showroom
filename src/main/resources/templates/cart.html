<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Кошик</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                    radial-gradient(circle at top left, rgba(138,43,226,0.12), transparent 28%),
                    radial-gradient(circle at top right, rgba(255,20,147,0.10), transparent 24%),
                    linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.97)),
                    url('/images/bg3.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 32px;
        }

        .page-shell {
            max-width: 1200px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 26px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 22px;
            border: 1px solid rgba(255,255,255,0.8);
            color: white;
            text-decoration: none;
            border-radius: 0;
            transition: .3s;
            background: rgba(255,255,255,0.03);
            letter-spacing: .4px;
        }

        .back-btn:hover {
            background: linear-gradient(45deg,#8a2be2,#ff1493);
            border-color: transparent;
            box-shadow: 0 0 18px rgba(255,20,147,0.28);
            transform: translateY(-2px);
        }

        .hero-box {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            backdrop-filter: blur(14px);
            padding: 34px 34px 30px 34px;
            margin-bottom: 34px;
            box-shadow:
                    0 0 0 1px rgba(255,255,255,0.02) inset,
                    0 25px 60px rgba(0,0,0,0.30);
        }

        .hero-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-title {
            margin: 0;
            color: #ffffff;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .hero-subtitle {
            margin: 10px 0 0 0;
            color: #cfcfcf;
            font-size: 17px;
            line-height: 1.7;
            max-width: 720px;
        }

        .hero-badge {
            border: 1px solid rgba(255,255,255,0.12);
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            min-width: 180px;
            text-align: center;
        }

        .hero-badge-title {
            color: #9e9e9e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            margin-bottom: 8px;
        }

        .hero-badge-value {
            color: #ff4dd2;
            font-size: 24px;
            font-weight: 800;
        }

        .empty {
            text-align: center;
            color: #8a8a8a;
            font-style: italic;
            font-size: 18px;
            padding: 34px 20px;
            border: 1px dashed rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.02);
        }

        .cart-list {
            display: grid;
            gap: 22px;
        }

        .cart-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            padding: 24px;
            border-radius: 0;
            transition: .3s;
            box-shadow:
                    0 10px 30px rgba(0,0,0,0.22),
                    0 0 0 1px rgba(255,255,255,0.02) inset;
            overflow: hidden;
        }

        .cart-item::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
        }

        .cart-item:hover {
            border-color: rgba(255,0,204,0.45);
            box-shadow:
                    0 16px 40px rgba(0,0,0,0.30),
                    0 0 24px rgba(255,0,204,0.10);
            transform: translateY(-4px);
        }

        .cart-left {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }

        .cart-left img {
            width: 140px;
            height: 105px;
            object-fit: cover;
            border-radius: 0;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            flex-shrink: 0;
        }

        .item-info h3 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #ffffff;
            font-weight: 800;
            line-height: 1.35;
        }

        .item-meta {
            color: #9e9e9e;
            font-size: 14px;
            margin-bottom: 10px;
            letter-spacing: .3px;
        }

        .price {
            color: #ff4dd2;
            font-weight: 800;
            font-size: 22px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            min-width: 150px;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 0;
            text-decoration: none;
            color: white;
            transition: .3s;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: linear-gradient(45deg,#8a2be2,#ff1493);
            border-color: transparent;
            box-shadow: 0 0 14px rgba(255,20,147,0.22);
        }

        .remove-btn {
            border-color: #ff4d4d;
            color: #ff7676;
        }

        .remove-btn:hover {
            background: #ff4d4d;
            color: white;
            border-color: #ff4d4d;
            box-shadow: none;
        }

        .summary-box {
            position: relative;
            margin-top: 30px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            padding: 28px;
            border-radius: 0;
            box-shadow:
                    0 10px 30px rgba(0,0,0,0.22),
                    0 0 0 1px rgba(255,255,255,0.02) inset;
            overflow: hidden;
        }

        .summary-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
        }

        .summary-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .summary-label {
            color: #9e9e9e;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        .total {
            font-size: 34px;
            color: #ffffff;
            font-weight: 800;
        }

        .total span {
            color: #ff4dd2;
        }

        .summary-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media(max-width:900px) {
            .cart-item {
                flex-direction: column;
                align-items: stretch;
            }

            .cart-left {
                align-items: flex-start;
            }
        }

        @media(max-width:768px) {
            body {
                padding: 18px;
            }

            .hero-box {
                padding: 24px 20px;
            }

            .hero-title {
                font-size: 30px;
            }

            .hero-subtitle {
                font-size: 15px;
            }

            .cart-left {
                flex-direction: column;
            }

            .cart-left img {
                width: 100%;
                height: auto;
                max-height: 220px;
            }

            .item-info h3 {
                font-size: 22px;
            }

            .total {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="page-shell">

    <div class="topbar">
        <a href="/periphery" class="back-btn">← Назад до периферії</a>
    </div>

    <div class="hero-box">
        <div class="hero-top">
            <div>
                <h1 class="hero-title">Кошик</h1>
                <p class="hero-subtitle">
                    Перевірте вибрані товари, видаліть зайве або перейдіть до оформлення замовлення.
                </p>
            </div>

            <div class="hero-badge">
                <div class="hero-badge-title">Товарів у кошику</div>
                <div class="hero-badge-value" th:text="${#lists.size(cart)}">0</div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cart)}" class="empty">
        Ваш кошик порожній.
    </div>

    <div th:if="${not #lists.isEmpty(cart)}" class="cart-list">
        <div th:each="item, iStat : ${cart}" class="cart-item">
            <div class="cart-left">
                <img th:src="@{${item.imageUrl}}">
                <div class="item-info">
                    <h3 th:text="${item.name}"></h3>
                    <div class="item-meta">Додано до кошика</div>
                    <div class="price" th:text="${item.price} + ' $'"></div>
                </div>
            </div>

            <a th:href="@{'/cart/remove/' + ${iStat.index}}" class="btn remove-btn">🗑 Видалити</a>
        </div>
    </div>

    <div class="summary-box" th:if="${not #lists.isEmpty(cart)}">
        <div class="summary-top">
            <div>
                <div class="summary-label">Підсумок замовлення</div>
            </div>

            <div class="total">
                Разом: <span th:text="${total} + ' $'"></span>
            </div>
        </div>

        <div class="summary-actions">
            <a href="/cart/checkout" class="btn">🛒 Оформити замовлення</a>
            <a href="/cart/clear" class="btn remove-btn">Очистити кошик</a>
        </div>
    </div>

</div>

</body>
</html>
